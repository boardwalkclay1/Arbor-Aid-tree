<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arbor Aid Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/app.js" defer></script>

  <style>
    body {
      background: #111;
      color: #fff;
      padding: 20px;
      font-family: 'Rubik Wet Paint', cursive;
    }

    h1, h2 {
      margin-bottom: 10px;
      text-shadow: 0 0 8px black;
    }

    .admin-section {
      background: rgba(0,0,0,0.75);
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px black;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 16px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
    }

    button {
      margin-top: 14px;
      padding: 12px 20px;
      background: red;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 10px black;
    }

    button:hover {
      background: #ff4d4d;
    }

    .analytics-box {
      background: rgba(0,0,0,0.65);
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body class="bg-home">

<h1>Arbor Aid Admin Dashboard</h1>

<!-- ============================
     ANALYTICS
============================ -->
<div class="admin-section">
  <h2>Business Analytics</h2>

  <div id="adminAnalytics">
    <div class="analytics-box">
      <strong>Total Jobs:</strong> <span id="adminJobs">—</span>
    </div>

    <div class="analytics-box">
      <strong>Total Revenue:</strong> <span id="adminRevenue">$0</span>
    </div>

    <div class="analytics-box">
      <strong>Open Contracts:</strong> <span id="adminOpenContracts">—</span>
    </div>
  </div>

  <button onclick="loadAdminAnalytics()">Refresh Analytics</button>
</div>

<!-- ============================
     CONTRACT CREATOR
============================ -->
<div class="admin-section">
  <h2>Create Contract</h2>

  <form id="contractForm">
    <label>Customer Name</label>
    <input name="customer_name" required>

    <label>Customer Email</label>
    <input name="customer_email">

    <label>Customer Phone</label>
    <input name="customer_phone">

    <label>Address</label>
    <input name="address">

    <label>Service</label>
    <input name="service">

    <label>Price</label>
    <input name="price">

    <label>Terms</label>
    <textarea name="terms"></textarea>

    <button type="submit">Create Contract</button>
  </form>

  <script>
    document.getElementById("contractForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await sendContract("contractForm", "/api/admin/contract");
    });
  </script>
</div>

<!-- ============================
     INVOICE CREATOR
============================ -->
<div class="admin-section">
  <h2>Create Invoice</h2>

  <form id="invoiceForm">
    <label>Customer Name</label>
    <input name="customer_name" required>

    <label>Customer Email</label>
    <input name="customer_email">

    <label>Customer Phone</label>
    <input name="customer_phone">

    <label>Address</label>
    <input name="address">

    <label>Service</label>
    <input name="service">

    <label>Price</label>
    <input name="price">

    <label>Due Date</label>
    <input name="due_date" type="date">

    <button type="submit">Create Invoice</button>
  </form>

  <script>
    document.getElementById("invoiceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await sendContract("invoiceForm", "/api/admin/invoice");
    });
  </script>
</div>

<!-- ============================
     WEATHER TEST
============================ -->
<div class="admin-section">
  <h2>Weather API Test</h2>
  <button onclick="testWeather()">Load Weather</button>
  <p id="weatherTestResult"></p>

  <script>
    async function testWeather() {
      const res = await fetch("/api/weather?city=Atlanta");
      const data = await res.json();
      document.getElementById("weatherTestResult").textContent =
        `Weather: ${data.description} — ${data.temp}°F`;
    }
  </script>
</div>

<!-- ============================
     REVIEWS TEST
============================ -->
<div class="admin-section">
  <h2>Latest Reviews</h2>
  <button onclick="loadAdminReviews()">Load Reviews</button>
  <div id="adminReviews"></div>

  <script>
    async function loadAdminReviews() {
      const res = await fetch("/api/reviews?limit=5");
      const reviews = await res.json();

      const box = document.getElementById("adminReviews");
      box.innerHTML = "";

      reviews.forEach(r => {
        const div = document.createElement("div");
        div.className = "analytics-box";
        div.innerHTML = `
          <strong>${r.title || "Review"}</strong><br>
          ${r.text}<br>
          <em>${r.name || "Customer"} — ${r.city || "Atlanta"}</em>
        `;
        box.appendChild(div);
      });
    }
  </script>
</div>

<!-- ============================
     FALLING LEAVES
============================ -->
<div id="leaf-container"></div>

</body>
</html>
