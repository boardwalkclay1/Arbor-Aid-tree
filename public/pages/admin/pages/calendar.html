<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar — Arbor Aid Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Arbor Aid Admin — Calendar">
  <meta property="og:description" content="Manage job calendar for Arbor Aid Tree Service.">
  <meta property="og:image" content="/img/arbor-aid-logo.jpg">
  <meta property="og:type" content="website">

  <link rel="icon" href="/img/arbor-aid-logo.jpg" type="image/png">

  <link rel="stylesheet" href="/pages/admin/css/admin.css">
  <script src="/pages/admin/js/admin.js" defer></script>
</head>

<body>
<header class="admin-header">
  <h1>Calendar</h1>
  <nav class="admin-nav">
    <a href="/admin/index.html">Dashboard</a>
    <a href="/admin/customers.html">Customers</a>
    <a href="/admin/jobs.html">Jobs</a>
    <a href="/admin/contracts.html">Contracts</a>
    <a href="/admin/invoices.html">Invoices</a>
    <a href="/admin/reviews.html">Reviews</a>
    <a href="/admin/analytics.html">Analytics</a>
  </nav>
</header>

<main>
  <section class="admin-section">
    <h2>Create Calendar Event</h2>

    <form id="calendarForm" class="admin-form">
      <label>Job ID</label><input name="job_id">
      <label>Title</label><input name="title" required>
      <label>Start Date/Time</label><input type="datetime-local" name="start_datetime" required>
      <label>End Date/Time</label><input type="datetime-local" name="end_datetime">
      <label>Crew Assigned</label><input name="crew_assigned">
      <label>Notes</label><textarea name="notes"></textarea>
      <button type="button" onclick="createCalendarEvent('calendarForm')">Create Event</button>
    </form>
  </section>

  <section class="admin-section">
    <h2>Upcoming Events</h2>
    <div id="calendarEvents"></div>
  </section>
</main>
</body>
</html>
