<!-- ============================

============================ -->

<!-- ============================
     HERO
============================ -->
<section class="page-hero">
  <h1 class="header-font">Request a Free Estimate</h1>
  <p>Fast, accurate quotes for any tree service.</p>
</section>

<!-- ============================
     ESTIMATE FORM (STYLED)
============================ -->
<section class="estimate-section">

  <form id="estimateForm" method="POST" action="/api/estimate" class="styled-form">

    <label>Your Name</label>
    <input type="text" name="name" required>

    <label>Phone Number</label>
    <input type="text" name="phone" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Service Needed</label>
    <select name="service" required>
      <option value="Tree Removal">Tree Removal</option>
      <option value="Tree Trimming">Tree Trimming</option>
      <option value="Stump Grinding">Stump Grinding</option>
      <option value="Emergency Storm Cleanup">Emergency Storm Cleanup</option>
      <option value="Lot Clearing">Lot Clearing</option>
    </select>

    <label>Describe Your Project</label>
    <textarea name="details" required></textarea>

    <button type="submit" class="cta-btn link-font bubble-link">Submit Estimate Request</button>

  </form>

</section>

============================ -->
