<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="Free Tree Service Estimate">
  <meta property="og:description" content="Request a free estimate for tree removal, trimming, stump grinding, or storm cleanup.">
  <meta property="og:image" content="/img/arbor-aid-logo.jpg">

  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/app.js" defer></script>
</head>

<body class="bg-estimate">

<header class="main-header">
  <div class="logo-menu" onclick="toggleMenu()">
    <img src="/img/arbor-aid-logo.jpg">
    <span class="brand-name">ARBOR AID TREE SERVICE</span>
  </div>

  <nav id="mainNav" class="nav-links">
    <a href="/index.html">Home</a>
    <a href="/pages/services.html">Services</a>
    <a href="/pages/gallery.html">Gallery</a>
    <a href="/pages/testimonials.html">Testimonials</a>
    <a href="/pages/service-areas.html">Service Areas</a>
    <a href="/pages/faq.html">FAQ</a>
    <a href="/pages/emergency.html">Emergency</a>
    <a href="/pages/insurance.html">Insurance</a>
    <a href="/pages/about.html">About</a>
    <a href="/pages/estimate.html" class="active">Estimate</a>
    <a href="/pages/contact.html" class="contact-btn">Contact</a>
  </nav>

  <div class="contact-info">
    <a href="tel:+14045673819">📞 (404) 567‑3819</a>
    <a href="mailto:victor@arbor-aid.com">✉️ victor@arbor-aid.com</a>
  </div>
</header>

<section class="page-hero">
  <h1>Request a Free Estimate</h1>
  <p>Fast, accurate quotes for any tree service.</p>
</section>

<section class="estimate-section">
  <form id="estimateForm" method="POST" action="/api/estimate">
    <label>Your Name</label>
    <input type="text" name="name" required>

    <label>Phone Number</label>
    <input type="text" name="phone" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Service Needed</label>
    <select name="service" required>
      <option value="Tree Removal">Tree Removal</option>
      <option value="Tree Trimming">Tree Trimming</option>
      <option value="Stump Grinding">Stump Grinding</option>
      <option value="Emergency Storm Cleanup">Emergency Storm Cleanup</option>
      <option value="Lot Clearing">Lot Clearing</option>
    </select>

    <label>Describe Your Project</label>
    <textarea name="details" required></textarea>

    <button type="submit" class="cta-btn">Submit Estimate Request</button>
  </form>
</section>

<footer class="footer">
  <p>© 2026 Arbor Aid Tree Service</p>
</footer>

<a href="tel:+14045673819" class="floating-btn">Call Arbor Aid</a>
<div id="leaf-container"></div>

</body>
